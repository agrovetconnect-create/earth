<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Earth Talk</title>
</head>
<body style="margin:0;padding:32px 12px;background:#eef2f5;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.6">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;border-collapse:collapse">
    <tr>
      <td style="background:#fff;padding:18px 28px;text-align:center;border-bottom:1px solid #e2e8f0">
        <a href="{{ .SiteURL }}/" style="text-decoration:none;display:inline-block">
          <img src="https://svyjfgptkqltrpinhusk.supabase.co/storage/v1/object/public/email-assets/logo_withsubtitle.png" alt="Earth Talk" style="height:44px;width:auto;display:block;margin:0 auto;border:0" />
        </a>
      </td>
    </tr>
    <tr>
      <td style="padding:0;line-height:0;background:#162833">
        <img src="https://svyjfgptkqltrpinhusk.supabase.co/storage/v1/object/public/email-assets/media/pool/field-01.jpg" alt="Earth Talk geological field site" width="100%" style="width:100%;max-width:100%;height:190px;object-fit:cover;display:block;margin:0 auto;border:0" />
      </td>
    </tr>
    <tr>
      <td style="background:#1e3442;padding:36px 34px 38px;text-align:center">
        <h1 style="margin:0 0 14px;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.25;font-weight:700;color:#f4c563">Welcome to Earth Talk</h1>
        <p style="margin:0 auto 18px;max-width:430px;font-size:14px;line-height:1.7;color:#f5e6c4">Your Google account is verified and ready. Enter the code below in Earth Talk to finish signing in.</p>
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:340px;margin:0 auto 22px;border-collapse:collapse">
          <tr>
            <td style="background:#13242e;border:1px solid #355466;border-radius:10px;padding:18px 20px;text-align:center">
              <span style="font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:800;letter-spacing:9px;color:#f4c563;display:inline-block;padding-left:9px">{{ .Token }}</span>
            </td>
          </tr>
        </table>
        <p style="margin:0 0 8px;font-size:13px;color:#f5e6c4">This code expires in <strong>10 minutes</strong>.</p>
        <p style="margin:0;font-size:12px;font-weight:600;color:#fca5a5">Never share this code with anyone.</p>
      </td>
    </tr>
    <tr>
      <td style="background:#14232d;padding:18px 28px;text-align:center;border-top:1px solid #284252">
        <p style="margin:0;font-size:12px;color:#cbd5e1"><strong>Earth Talk</strong> &bull; Every Earth Feature Has a Story.</p>
      </td>
    </tr>
  </table>
</body>
</html>
