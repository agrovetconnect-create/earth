services:
  - type: web
    name: earth-talk
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ENABLE_SECURITY_HEADERS
        value: "true"
      - key: DEMO_POSTS_ENABLED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD_HASH
        sync: false
      - key: SUPER_ADMIN_SESSION_SECRET
        sync: false
      - key: ANONYMOUS_CONTRIBUTOR_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: CONTROL_CENTER_URL
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: USER_HASH_SECRET
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
